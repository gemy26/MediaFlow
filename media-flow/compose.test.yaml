services:
  postgres:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 1s
  minio:
    container_name: minio-test
    volumes: !reset []
    tmpfs:
      - /data
